<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Quiz battle</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tomo.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
body{margin:0}
a{color:var(--primary)}a:hover{color:var(--primary-depth)}
</style>
</helmet>
<div class="tomo board" data-theme="{{ theme }}">
<div class="switch" role="group" aria-label="Thème des maquettes"><button class="{{ lightCls }}" aria-pressed="{{ isLight }}" onClick="{{ toLight }}"><i class="ic s18 i-sun" aria-hidden="true"></i>Clair</button><button class="{{ darkCls }}" aria-pressed="{{ isDark }}" onClick="{{ toDark }}"><i class="ic s18 i-moon" aria-hidden="true"></i>Sombre</button></div>
<div class="iphone"><i class="key k1"></i><i class="key k2"></i><i class="key k3"></i><i class="key k4"></i>
<div class="screen">
<div class="island"></div>
<div class="status" aria-hidden="true"><span class="tnum">9:41</span><span class="si"><i class="ic i-cell-signal-full"></i><i class="ic i-wifi-high"></i><i class="ic i-battery-full"></i></span></div>
<div class="appbar"><a class="ib" href="GuerreGuilds.dc.html" aria-label="Quitter le quiz"><i class="ic i-x" aria-hidden="true"></i></a><span class="title" style="text-align: center">Question 4 / 10</span><span class="ib" aria-hidden="true"></span></div>
<div class="main" style="gap: 16px; padding: 4px 20px 40px">
<div class="card tight" style="flex-direction: row; align-items: center; justify-content: space-between">
<div class="row g8"><span class="av s a5" aria-hidden="true">R</span><span class="stack"><b class="b8 sm">Toi</b><b class="t3 c-primary tnum">{{ myScore }}</b></span></div>
<span class="lbl muted">VS</span>
<div class="row g8"><span class="stack" style="text-align: right"><b class="b8 sm">Kenji</b><b class="t3 c-sakura tnum">200</b></span><span class="av s a2" aria-hidden="true">K</span></div>
</div>
<div class="stack g6"><span class="row between lbl"><span class="muted">Temps restant</span><span class="tnum c-sakura">0:08</span></span><span class="bar war"><i style="width: 55%"></i></span></div>
<h1 class="t2" style="text-align: center; padding: 12px 0">Comment appelle-t-on un anime centré sur des robots géants pilotés ?</h1>
<div class="stack g10">
<sc-for list="{{ answers }}" as="a" hint-placeholder-count="4">
<button class="{{ a.cls }}" onClick="{{ a.pick }}" style="justify-content: flex-start; gap: 12px; width: 100%"><span class="center" style="width: 32px; height: 32px; border-radius: 10px; background: var(--surface-sunken); color: var(--ink); font-weight: 900">{{ a.key }}</span>{{ a.label }}</button>
</sc-for>
</div>
<sc-if value="{{ answered }}" hint-placeholder-val="{{ false }}">
<div class="row g8 push" style="padding: 12px; border-radius: 14px; background: {{ fbBg }}; color: {{ fbInk }}"><i class="{{ fbIcon }}" aria-hidden="true"></i><span class="sm b8 grow">{{ feedback }}</span></div>
<a class="btn p block" href="QuizResultat.dc.html">Question suivante</a>
</sc-if>
</div>
<div class="home"></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":425,"height":940}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { theme: this.stored(), picked: null }; this.onStore = (e) => { if (e.key === 'tomo-theme' && e.newValue) this.setState({ theme: e.newValue === 'dark' ? 'dark' : 'light' }); }; }
  stored() { try { const v = window.localStorage.getItem('tomo-theme'); if (v) return v === 'dark' ? 'dark' : 'light'; } catch (e) {} return this.props.theme === 'dark' ? 'dark' : 'light'; }
  componentDidMount() { try { window.addEventListener('storage', this.onStore); } catch (e) {} }
  componentWillUnmount() { try { window.removeEventListener('storage', this.onStore); } catch (e) {} }
  componentDidUpdate(prev) { if (prev.theme !== this.props.theme && this.props.theme) this.setTheme(this.props.theme); }
  setTheme(t) { try { window.localStorage.setItem('tomo-theme', t); } catch (e) {} this.setState({ theme: t }); }
  renderVals() {
    const t = this.state.theme; const picked = this.state.picked; const good = 'B';
    const list = [['A', 'Isekai'], ['B', 'Mecha'], ['C', 'Josei'], ['D', 'Slice of life']];
    const answers = list.map((x) => {
      let cls = 'btn g';
      if (picked) { if (x[0] === good) cls = 'btn p'; else if (x[0] === picked) cls = 'btn danger'; }
      return { key: x[0], label: x[1], cls: cls, pick: () => { if (!this.state.picked) this.setState({ picked: x[0] }); } };
    });
    const right = picked === good;
    return { theme: t, lightCls: t === 'light' ? 'on' : '', darkCls: t === 'dark' ? 'on' : '', isLight: t === 'light', isDark: t === 'dark', toLight: () => this.setTheme('light'), toDark: () => this.setTheme('dark'),
      answers: answers, answered: !!picked, myScore: right ? 400 : 300, fbBg: right ? 'var(--success-soft)' : 'var(--danger-soft)', fbInk: right ? 'var(--success-ink)' : 'var(--danger-ink)', fbIcon: right ? 'ic i-check-circle' : 'ic i-warning', feedback: right ?'Bien joué ! +100 points pour ta guild' : 'Raté, la bonne réponse était Mecha' };
  }
}
</script>
</body>
</html>
