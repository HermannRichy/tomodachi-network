<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Guerre de guilds</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tomo.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
body{margin:0}
a{color:var(--primary)}a:hover{color:var(--primary-depth)}
</style>
</helmet>
<div class="tomo board" data-theme="{{ theme }}">
<div class="switch" role="group" aria-label="Thème des maquettes"><button class="{{ lightCls }}" aria-pressed="{{ isLight }}" onClick="{{ toLight }}"><i class="ic s18 i-sun" aria-hidden="true"></i>Clair</button><button class="{{ darkCls }}" aria-pressed="{{ isDark }}" onClick="{{ toDark }}"><i class="ic s18 i-moon" aria-hidden="true"></i>Sombre</button></div>
<div class="iphone"><i class="key k1"></i><i class="key k2"></i><i class="key k3"></i><i class="key k4"></i>
<div class="screen">
<div class="island"></div>
<div class="status" aria-hidden="true"><span class="tnum">9:41</span><span class="si"><i class="ic i-cell-signal-full"></i><i class="ic i-wifi-high"></i><i class="ic i-battery-full"></i></span></div>
<div class="appbar"><a class="ib" href="Guild.dc.html" aria-label="Retour"><i class="ic i-arrow-left" aria-hidden="true"></i></a><span class="title">Guerre de guilds</span><span class="badge b-sak" style="margin-right: 8px"><i class="ic i-timer" aria-hidden="true"></i>1 j 22 h</span></div>
<div class="main" style="gap: 14px; padding: 4px 16px 24px">
<div class="card" style="gap: 14px">
<div class="row" style="justify-content: space-around">
<div class="center" style="gap: 6px"><span class="center" style="width: 64px; height: 64px; border-radius: 20px; background: var(--sakura); color: var(--on-sakura); border-bottom: 4px solid var(--sakura-depth)"><i class="ic s32 i-shield-fill" aria-hidden="true"></i></span><b class="b8 sm">Sakura Ronin</b><b class="t1 c-sakura tnum">2 340</b></div>
<span class="center" style="width: 44px; height: 44px; border-radius: 50%; background: var(--surface-sunken); color: var(--ink-muted)"><i class="ic i-sword" aria-hidden="true"></i></span>
<div class="center" style="gap: 6px"><span class="center" style="width: 64px; height: 64px; border-radius: 20px; background: #3a46c8; color: #ffffff; border-bottom: 4px solid #2a3290"><i class="ic s32 i-shield-fill" aria-hidden="true"></i></span><b class="b8 sm">Kitsune Clan</b><b class="t1 muted tnum">1 910</b></div>
</div>
<div class="row" style="height: 14px; border-radius: 999px; overflow: hidden; gap: 0"><span style="width: 55%; height: 100%; background: var(--sakura)"></span><span style="flex: 1; height: 100%; background: var(--primary)"></span></div>
<p class="sm b8 c-sakura" style="text-align: center">Vous menez de 430 points</p>
</div>
<section class="stack g8">
<h2 class="section-t">Épreuves</h2>
<div class="list">
<div class="li"><i class="ic lead i-question" aria-hidden="true"></i><span class="grow b8 sm">Quiz battles</span><span class="sm tnum"><b class="b9 c-sakura">980</b> <span class="muted">· 720</span></span></div>
<div class="li"><i class="ic lead i-pencil-simple" aria-hidden="true"></i><span class="grow b8 sm">Critiques publiées</span><span class="sm tnum"><b class="b9 c-sakura">760</b> <span class="muted">· 640</span></span></div>
<div class="li"><i class="ic lead i-target" aria-hidden="true"></i><span class="grow b8 sm">Défis de l'arc</span><span class="sm tnum"><b class="b9 c-sakura">600</b> <span class="muted">· 550</span></span></div>
</div>
</section>
<section class="stack g8">
<h2 class="section-t">Meilleurs guerriers</h2>
<div class="list">
<div class="li"><span class="b9 tnum" style="width: 16px; color: var(--gold-depth)">1</span><span class="av s a4" aria-hidden="true">S</span><span class="grow b8 sm">Sora</span><span class="sm b8 tnum">420 pts</span></div>
<div class="li"><span class="b9 tnum muted" style="width: 16px">2</span><span class="av s a1" aria-hidden="true">A</span><span class="grow b8 sm">Aïko</span><span class="sm b8 tnum">380 pts</span></div>
<div class="li" style="background: var(--primary-soft)"><span class="b9 tnum" style="width: 16px; color: var(--primary-ink)">7</span><span class="av s a5" aria-hidden="true">R</span><span class="grow b8 sm" style="color: var(--primary-ink)">Toi</span><span class="sm b8 tnum" style="color: var(--primary-ink)">190 pts</span></div>
</div>
</section>
<a class="btn s block push" href="Quiz.dc.html"><i class="ic i-sword" aria-hidden="true"></i>Lancer un quiz battle</a>
</div>
<div class="home"></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":425,"height":940}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { theme: this.stored() }; this.onStore = (e) => { if (e.key === 'tomo-theme' && e.newValue) this.setState({ theme: e.newValue === 'dark' ? 'dark' : 'light' }); }; }
  stored() { try { const v = window.localStorage.getItem('tomo-theme'); if (v) return v === 'dark' ? 'dark' : 'light'; } catch (e) {} return this.props.theme === 'dark' ? 'dark' : 'light'; }
  componentDidMount() { try { window.addEventListener('storage', this.onStore); } catch (e) {} }
  componentWillUnmount() { try { window.removeEventListener('storage', this.onStore); } catch (e) {} }
  componentDidUpdate(prev) { if (prev.theme !== this.props.theme && this.props.theme) this.setTheme(this.props.theme); }
  setTheme(t) { try { window.localStorage.setItem('tomo-theme', t); } catch (e) {} this.setState({ theme: t }); }
  renderVals() { const t = this.state.theme; return { theme: t, lightCls: t === 'light' ? 'on' : '', darkCls: t === 'dark' ? 'on' : '', isLight: t === 'light', isDark: t === 'dark', toLight: () => this.setTheme('light'), toDark: () => this.setTheme('dark') }; }
}
</script>
</body>
</html>
