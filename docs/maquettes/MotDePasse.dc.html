<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mot de passe oublié</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tomo.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
body{margin:0}
a{color:var(--primary)}a:hover{color:var(--primary-depth)}
</style>
</helmet>
<div class="tomo board" data-theme="{{ theme }}">
<div class="switch" role="group" aria-label="Thème des maquettes"><button class="{{ lightCls }}" aria-pressed="{{ isLight }}" onClick="{{ toLight }}"><i class="ic s18 i-sun" aria-hidden="true"></i>Clair</button><button class="{{ darkCls }}" aria-pressed="{{ isDark }}" onClick="{{ toDark }}"><i class="ic s18 i-moon" aria-hidden="true"></i>Sombre</button></div>
<div class="iphone"><i class="key k1"></i><i class="key k2"></i><i class="key k3"></i><i class="key k4"></i>
<div class="screen">
<div class="island"></div>
<div class="status" aria-hidden="true"><span class="tnum">9:41</span><span class="si"><i class="ic i-cell-signal-full"></i><i class="ic i-wifi-high"></i><i class="ic i-battery-full"></i></span></div>
<div class="appbar"><a class="ib" href="Connexion.dc.html" aria-label="Retour"><i class="ic i-arrow-left" aria-hidden="true"></i></a><span class="title"></span></div>
<div class="main" style="gap: 20px; padding: 8px 20px 40px">
<div class="center" style="gap: 12px">
<div class="center" style="width: 88px; height: 88px; border-radius: 28px; background: var(--gold-soft); color: var(--gold-ink)"><i class="ic s40 i-key" aria-hidden="true"></i></div>
<h1 class="t1">Mot de passe oublié ?</h1>
<p class="body muted">Pas de panique. Donne ton email, on t'envoie un lien pour en choisir un nouveau.</p>
</div>
<label class="field"><span class="lab">Email</span><span class="input focus"><i class="ic s20 i-envelope-simple" aria-hidden="true"></i><input type="email" value="ren@exemple.com" aria-label="Email"></span></label>
<sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
<button class="btn p block" onClick="{{ send }}">Envoyer le lien</button>
</sc-if>
<sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
<div class="card gold" role="status">
<div class="row g10"><i class="ic i-check-circle c-success" aria-hidden="true"></i><span class="t3">Lien envoyé</span></div>
<p class="sm">Regarde ta boîte mail. Le lien reste valable 30 minutes.</p>
</div>
<a class="btn g block" href="Connexion.dc.html">Retour à la connexion</a>
</sc-if>
<p class="sm muted push" style="text-align: center">Tu n'as plus accès à cet email ? <a class="b8" href="#support">Contacter le support</a></p>
</div>
<div class="home"></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":425,"height":940}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { theme: this.stored(), sent: false }; this.onStore = (e) => { if (e.key === 'tomo-theme' && e.newValue) this.setState({ theme: e.newValue === 'dark' ? 'dark' : 'light' }); }; }
  stored() { try { const v = window.localStorage.getItem('tomo-theme'); if (v) return v === 'dark' ? 'dark' : 'light'; } catch (e) {} return this.props.theme === 'dark' ? 'dark' : 'light'; }
  componentDidMount() { try { window.addEventListener('storage', this.onStore); } catch (e) {} }
  componentWillUnmount() { try { window.removeEventListener('storage', this.onStore); } catch (e) {} }
  componentDidUpdate(prev) { if (prev.theme !== this.props.theme && this.props.theme) this.setTheme(this.props.theme); }
  setTheme(t) { try { window.localStorage.setItem('tomo-theme', t); } catch (e) {} this.setState({ theme: t }); }
  renderVals() { const t = this.state.theme; return { theme: t, lightCls: t === 'light' ? 'on' : '', darkCls: t === 'dark' ? 'on' : '', isLight: t === 'light', isDark: t === 'dark', toLight: () => this.setTheme('light'), toDark: () => this.setTheme('dark'), sent: this.state.sent, notSent: !this.state.sent, send: () => this.setState({ sent: true }) }; }
}
</script>
</body>
</html>
