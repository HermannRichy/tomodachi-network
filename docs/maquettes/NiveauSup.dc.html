<div class="island"></div>
<div class="status inv" aria-hidden="true"><span class="tnum">9:41</span><span class="si"><i class="ic i-cell-signal-full"></i><i class="ic i-wifi-high"></i><i class="ic i-battery-full"></i></span></div>
<div class="appbar"><span class="grow"></span><a class="ib" href="Feed.dc.html" aria-label="Fermer"><i class="ic i-x" aria-hidden="true"></i></a></div>
<div class="main" style="gap: 20px; padding: 0 24px 40px">

<img class="kami" src="/_blob/1df6506d2e5adfc222b3f48ccc4a05a9" width="170" height="160" alt="Kami-sama te félicite">
<p class="lbl" style="letter-spacing: 0.08em; opacity: 0.85">NIVEAU SUPÉRIEUR</p>
<h1 class="display" style="font-size: 64px; line-height: 64px">13</h1>
<p class="t3">Stratège · rang Chūnin</p>
<div class="stack g6" style="width: 100%; margin-top: 8px">
<span class="bar exp thick"><i style="width: 4%"></i></span>
<span class="row between cap tnum" style="opacity: 0.9"><span>80 / 2 200 EXP</span><span>Niveau 14</span></span>
</div>
</div>
<div class="card" style="color: var(--ink)">

</div>
<div class="home" style="background: var(--on-primary)"></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":425,"height":940}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { theme: this.stored() }; this.onStore = (e) => { if (e.key === 'tomo-theme' && e.newValue) this.setState({ theme: e.newValue === 'dark' ? 'dark' : 'light' }); }; }
  stored() { try { const v = window.localStorage.getItem('tomo-theme'); if (v) return v === 'dark' ? 'dark' : 'light'; } catch (e) {} return this.props.theme === 'dark' ? 'dark' : 'light'; }
  componentDidMount() { try { window.addEventListener('storage', this.onStore); } catch (e) {} }
  componentWillUnmount() { try { window.removeEventListener('storage', this.onStore); } catch (e) {} }
  componentDidUpdate(prev) { if (prev.theme !== this.props.theme && this.props.theme) this.setTheme(this.props.theme); }
  setTheme(t) { try { window.localStorage.setItem('tomo-theme', t); } catch (e) {} this.setState({ theme: t }); }
  renderVals() { const t = this.state.theme; return { theme: t, lightCls: t === 'light' ? 'on' : '', darkCls: t === 'dark' ? 'on' : '', isLight: t === 'light', isDark: t === 'dark', toLight: () => this.setTheme('light'), toDark: () => this.setTheme('dark') }; }
}
</script>
</body>
</html>
