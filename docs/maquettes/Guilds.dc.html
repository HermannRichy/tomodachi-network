<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Découvrir les guilds</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tomo.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
body{margin:0}
a{color:var(--primary)}a:hover{color:var(--primary-depth)}
</style>
</helmet>
<div class="tomo board" data-theme="{{ theme }}">
<div class="switch" role="group" aria-label="Thème des maquettes"><button class="{{ lightCls }}" aria-pressed="{{ isLight }}" onClick="{{ toLight }}"><i class="ic s18 i-sun" aria-hidden="true"></i>Clair</button><button class="{{ darkCls }}" aria-pressed="{{ isDark }}" onClick="{{ toDark }}"><i class="ic s18 i-moon" aria-hidden="true"></i>Sombre</button></div>
<div class="iphone"><i class="key k1"></i><i class="key k2"></i><i class="key k3"></i><i class="key k4"></i>
<div class="screen">
<div class="island"></div>
<div class="status" aria-hidden="true"><span class="tnum">9:41</span><span class="si"><i class="ic i-cell-signal-full"></i><i class="ic i-wifi-high"></i><i class="ic i-battery-full"></i></span></div>
<div class="appbar"><a class="ib" href="Guild.dc.html" aria-label="Retour"><i class="ic i-arrow-left" aria-hidden="true"></i></a><span class="title">Guilds</span></div>
<div class="main" style="gap: 14px; padding: 4px 16px 0">
<label class="input sunk"><i class="ic s20 i-magnifying-glass" aria-hidden="true"></i><input type="search" placeholder="Chercher une guild" aria-label="Chercher une guild"></label>
<button class="card tight" style="flex-direction: row; align-items: center; gap: 12px; font-family: inherit; text-align: left; cursor: pointer; border-style: dashed; border-bottom-style: solid"><span class="center" style="width: 44px; height: 44px; border-radius: 14px; background: var(--primary-soft); color: var(--primary-ink)"><i class="ic i-plus" aria-hidden="true"></i></span><span class="stack g4 grow"><b class="b8 body">Créer ma guild</b><span class="cap muted">Dès le niveau 10 · 500 pièces</span></span><i class="ic chev i-caret-right" aria-hidden="true" style="color: var(--ink-muted)"></i></button>
<section class="stack g8">
<div class="row between"><h2 class="section-t">Classement de la saison</h2><span class="cap muted">Arc d'automne</span></div>
<div class="list">
<div class="li"><span class="center" style="width: 28px; color: var(--gold-depth)"><i class="ic i-crown" aria-hidden="true"></i></span><span class="center" style="width: 40px; height: 40px; border-radius: 12px; background: #6d45b3; color: #ffffff"><i class="ic s20 i-shield-fill" aria-hidden="true"></i></span><span class="stack g4 grow"><b class="b8 sm">Tengu Club</b><span class="cap muted tnum">3 120 pts · 140 membres</span></span></div>
<div class="li"><span class="t3 muted tnum" style="width: 28px; text-align: center">2</span><span class="center" style="width: 40px; height: 40px; border-radius: 12px; background: #3a46c8; color: #ffffff"><i class="ic s20 i-shield-fill" aria-hidden="true"></i></span><span class="stack g4 grow"><b class="b8 sm">Kitsune Clan</b><span class="cap muted tnum">2 980 pts · 124 membres</span></span></div>
<div class="li" style="background: var(--sakura-soft)"><span class="t3 tnum c-sakura" style="width: 28px; text-align: center">3</span><span class="center" style="width: 40px; height: 40px; border-radius: 12px; background: var(--sakura); color: var(--on-sakura)"><i class="ic s20 i-shield-fill" aria-hidden="true"></i></span><span class="stack g4 grow"><b class="b8 sm">Sakura Ronin · ta guild</b><span class="cap tnum" style="color: var(--sakura-ink)">2 340 pts · 86 membres</span></span></div>
<div class="li"><span class="t3 muted tnum" style="width: 28px; text-align: center">4</span><span class="center" style="width: 40px; height: 40px; border-radius: 12px; background: #2b7556; color: #ffffff"><i class="ic s20 i-shield-fill" aria-hidden="true"></i></span><span class="stack g4 grow"><b class="b8 sm">Mecha Pilots</b><span class="cap muted tnum">2 100 pts · 97 membres</span></span></div>
</div>
</section>
<section class="stack g8">
<h2 class="section-t">Pour toi</h2>
<div class="card tight" style="flex-direction: row; align-items: center; gap: 12px"><span class="center" style="width: 44px; height: 44px; border-radius: 14px; background: #a4501a; color: #ffffff"><i class="ic i-shield-fill" aria-hidden="true"></i></span><span class="stack g4 grow"><b class="b8 body">Cuisine & Anime</b><span class="cap muted">Slice of life · 42 membres</span></span><button class="btn s sm">Rejoindre</button></div>
</section>
</div>
<nav class="tabbar" aria-label="Navigation principale">

</nav>
<div class="home"></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":425,"height":940}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { theme: this.stored() }; this.onStore = (e) => { if (e.key === 'tomo-theme' && e.newValue) this.setState({ theme: e.newValue === 'dark' ? 'dark' : 'light' }); }; }
  stored() { try { const v = window.localStorage.getItem('tomo-theme'); if (v) return v === 'dark' ? 'dark' : 'light'; } catch (e) {} return this.props.theme === 'dark' ? 'dark' : 'light'; }
  componentDidMount() { try { window.addEventListener('storage', this.onStore); } catch (e) {} }
  componentWillUnmount() { try { window.removeEventListener('storage', this.onStore); } catch (e) {} }
  componentDidUpdate(prev) { if (prev.theme !== this.props.theme && this.props.theme) this.setTheme(this.props.theme); }
  setTheme(t) { try { window.localStorage.setItem('tomo-theme', t); } catch (e) {} this.setState({ theme: t }); }
  renderVals() { const t = this.state.theme; return { theme: t, lightCls: t === 'light' ? 'on' : '', darkCls: t === 'dark' ? 'on' : '', isLight: t === 'light', isDark: t === 'dark', toLight: () => this.setTheme('light'), toDark: () => this.setTheme('dark') }; }
}
</script>
</body>
</html>
