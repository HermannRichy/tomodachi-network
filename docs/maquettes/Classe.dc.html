<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Choix de la classe</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tomo.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
body{margin:0}
a{color:var(--primary)}a:hover{color:var(--primary-depth)}
</style>
</helmet>
<div class="tomo board" data-theme="{{ theme }}">
<div class="switch" role="group" aria-label="Thème des maquettes"><button class="{{ lightCls }}" aria-pressed="{{ isLight }}" onClick="{{ toLight }}"><i class="ic s18 i-sun" aria-hidden="true"></i>Clair</button><button class="{{ darkCls }}" aria-pressed="{{ isDark }}" onClick="{{ toDark }}"><i class="ic s18 i-moon" aria-hidden="true"></i>Sombre</button></div>
<div class="iphone"><i class="key k1"></i><i class="key k2"></i><i class="key k3"></i><i class="key k4"></i>
<div class="screen">
<div class="island"></div>
<div class="status" aria-hidden="true"><span class="tnum">9:41</span><span class="si"><i class="ic i-cell-signal-full"></i><i class="ic i-wifi-high"></i><i class="ic i-battery-full"></i></span></div>
<div class="appbar"><a class="ib" href="Main.dc.html" aria-label="Retour"><i class="ic i-arrow-left" aria-hidden="true"></i></a><div class="steps grow" aria-label="Étape 1 sur 3"><i class="on"></i><i></i><i></i></div><span class="lbl muted" style="padding: 0 12px">1/3</span></div>
<div class="main" style="gap: 14px; padding: 4px 20px 40px">
<div class="stack g4">
<h1 class="t1">Choisis ta classe</h1>
<p class="body muted">Elle colore ta fiche de personnage. Tu pourras en changer plus tard.</p>
</div>
<div class="stack g10" role="radiogroup" aria-label="Classes">
<sc-for list="{{ classes }}" as="c" hint-placeholder-count="4">
<button class="{{ c.cls }}" role="radio" aria-checked="{{ c.on }}" onClick="{{ c.pick }}" style="flex-direction: row; align-items: center; gap: 14px; text-align: left; font-family: inherit; cursor: pointer; width: 100%">
<span class="center" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 16px; background: {{ c.tint }}; color: {{ c.ink }}"><i class="{{ c.icon }}" aria-hidden="true"></i></span>
<span class="stack g4 grow"><span class="t3">{{ c.name }}</span><span class="sm muted">{{ c.desc }}</span></span>
<sc-if value="{{ c.on }}" hint-placeholder-val="{{ false }}"><i class="ic i-check-circle c-primary" aria-hidden="true"></i></sc-if>
</button>
</sc-for>
</div>
<a class="btn p block push" href="Interets.dc.html">Continuer</a>
</div>
<div class="home"></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":425,"height":940}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { theme: this.stored(), picked: 'stratege' }; this.onStore = (e) => { if (e.key === 'tomo-theme' && e.newValue) this.setState({ theme: e.newValue === 'dark' ? 'dark' : 'light' }); }; }
  stored() { try { const v = window.localStorage.getItem('tomo-theme'); if (v) return v === 'dark' ? 'dark' : 'light'; } catch (e) {} return this.props.theme === 'dark' ? 'dark' : 'light'; }
  componentDidMount() { try { window.addEventListener('storage', this.onStore); } catch (e) {} }
  componentWillUnmount() { try { window.removeEventListener('storage', this.onStore); } catch (e) {} }
  componentDidUpdate(prev) { if (prev.theme !== this.props.theme && this.props.theme) this.setTheme(this.props.theme); }
  setTheme(t) { try { window.localStorage.setItem('tomo-theme', t); } catch (e) {} this.setState({ theme: t }); }
  renderVals() {
    const t = this.state.theme;
    const list = [
      { id: 'stratege', name: 'Stratège', desc: 'Analyses, théories, critiques détaillées.', icon: 'ic s28 i-target', tint: 'var(--primary-soft)', ink: 'var(--primary-ink)' },
      { id: 'mage', name: 'Mage', desc: 'Fan art, AMV, créations en tout genre.', icon: 'ic s28 i-sparkle', tint: 'var(--sakura-soft)', ink: 'var(--sakura-ink)' },
      { id: 'guerrier', name: 'Guerrier', desc: 'Quiz, défis et guerres de guilds.', icon: 'ic s28 i-sword', tint: 'var(--gold-soft)', ink: 'var(--gold-ink)' },
      { id: 'barde', name: 'Barde', desc: 'Watch parties, lives et discussions.', icon: 'ic s28 i-microphone', tint: 'var(--success-soft)', ink: 'var(--success-ink)' }
    ];
    const classes = list.map((c) => Object.assign({}, c, { on: this.state.picked === c.id, cls: this.state.picked === c.id ? 'card sel' : 'card', pick: () => this.setState({ picked: c.id }) }));
    return { theme: t, lightCls: t === 'light' ? 'on' : '', darkCls: t === 'dark' ? 'on' : '', isLight: t === 'light', isDark: t === 'dark', toLight: () => this.setTheme('light'), toDark: () => this.setTheme('dark'), classes: classes };
  }
}
</script>
</body>
</html>
