<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--ink)}
.wrap{padding:var(--space-4);display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:flex-start}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:52px;padding:0 var(--space-5);border-radius:var(--radius-lg);border:none;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;transition:transform .08s,border-bottom-width .08s}
.btn:active{transform:translateY(var(--depth-md));border-bottom-width:0!important}
.btn:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
.primary{background:var(--primary);color:var(--on-primary);border-bottom:var(--depth-md) solid var(--primary-depth)}
.sakura{background:var(--sakura);color:var(--on-sakura);border-bottom:var(--depth-md) solid var(--sakura-depth)}
.secondary{background:var(--surface);color:var(--primary);border:var(--border-width) solid var(--border);border-bottom:var(--depth-md) solid var(--border-depth)}
.icon{width:52px;padding:0}
.btn svg{width:20px;height:20px}
</style>
</head>
<body>
<div class="wrap">
<button class="btn primary">Créer mon compte</button>
<button class="btn sakura"><svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M177.62,159.6a52,52,0,0,1-34,34,12.2,12.2,0,0,1-3.6.55,12,12,0,0,1-3.6-23.45,28,28,0,0,0,18.32-18.32,12,12,0,0,1,22.9,7.2ZM220,144a92,92,0,0,1-184,0c0-28.810,11.27-58.18,33.48-87.28a12,12,0,0,1,17.9-1.33L107.07,74.5,127,19.89a12,12,0,0,1,18.94-5.120C168.2,33.25,220,82.85,220,144Zm-24,0c0-41.71-30.61-78.39-52.52-99.29l-20.21,55.4a12,12,0,0,1-19.63,4.5L80.71,82.36C67,103.38,60,124.06,60,144a68,68,0,0,0,136,0Z"></path></svg>Rejoindre la bataille</button>
<button class="btn secondary">J'ai déjà un compte</button>
<button class="btn primary icon" aria-label="Publier"><svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M228,128a12,12,0,0,1-12,12H140v76a12,12,0,0,1-24,0V140H40a12,12,0,0,1,0-24h76V40a12,12,0,0,1,24,0v76h76A12,12,0,0,1,228,128Z"></path></svg></button>
</div>
</body>
</html>
