<!-- @dsCard group="Progression" height=200 subtitle="EXP, visionnage, guerre de guilds" -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--ink)}
.wrap{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-4);max-width:360px}
.row{display:flex;flex-direction:column;gap:6px}
.top{display:flex;justify-content:space-between;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.top span:last-child{color:var(--ink-muted)}
.track{height:14px;border-radius:var(--radius-pill);overflow:hidden}
.fill{height:100%;border-radius:var(--radius-pill)}
.exp .track{background:var(--primary-depth)}
.exp .fill{background:var(--gold)}
.exp-panel{background:var(--primary);border-bottom:var(--depth-lg) solid var(--primary-depth);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);color:var(--on-primary)}
.exp-panel .top span:last-child{color:var(--on-primary);opacity:1}
.watch .track{height:8px;background:var(--success-soft)}
.watch .fill{background:var(--success)}
.war .track{background:var(--sakura-soft)}
.war .fill{background:var(--sakura)}
</style>
</head>
<body>
<div class="wrap">
<div class="exp-panel exp row" role="group" aria-label="Expérience"><div class="top"><span>Niveau 12</span><span>1 280 / 2 000 EXP</span></div><div class="track" role="progressbar" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100"><div class="fill" style="width:64%"></div></div></div>
<div class="watch row"><div class="top"><span>Lames du crépuscule</span><span>ép. 8 / 24</span></div><div class="track" role="progressbar" aria-valuenow="33" aria-valuemin="0" aria-valuemax="100"><div class="fill" style="width:33%"></div></div></div>
<div class="war row"><div class="top"><span>Sakura Ronin</span><span>2 340 pts</span></div><div class="track" role="progressbar" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100"><div class="fill" style="width:62%"></div></div></div>
</div>
</body>
</html>
