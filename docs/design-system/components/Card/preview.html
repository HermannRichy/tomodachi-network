<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--ink)}
.wrap{padding:var(--space-4);max-width:360px}
.card{background:var(--surface);border:var(--border-width) solid var(--border);border-bottom:var(--depth-md) solid var(--border-depth);border-radius:var(--radius-lg);padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
.head{display:flex;gap:var(--space-3);align-items:center}
.av{width:40px;height:40px;border-radius:var(--radius-pill);background:var(--gold);border:var(--border-width) solid var(--gold-depth);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--on-gold)}
.name{font-size:16px;font-weight:800}
.lvl{font-size:12px;font-weight:800;color:var(--gold-ink);background:var(--gold-soft);border-radius:var(--radius-sm);padding:2px 6px;margin-left:6px}
.meta{font-size:14px;font-weight:600;color:var(--ink-muted)}
p{margin:0;font-size:16px;line-height:24px;font-weight:600}
.react{align-self:flex-start;display:inline-flex;gap:6px;align-items:center;min-height:40px;padding:0 var(--space-3);border-radius:var(--radius-md);border:var(--border-width) solid var(--sakura-soft);border-bottom-width:var(--depth-sm);background:var(--sakura-soft);color:var(--sakura-ink);font-family:inherit;font-weight:800;font-size:14px}
.react svg{width:18px;height:18px}
</style>
</head>
<body>
