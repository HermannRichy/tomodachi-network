<!-- @dsCard group="Contenu" height=96 subtitle="Niveau, officiel, titre, statut" -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--ink)}
.wrap{padding:var(--space-4);display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}
.b{font-size:13px;line-height:16px;font-weight:800;border-radius:var(--radius-sm);padding:4px 8px;border:var(--border-width) solid transparent}
.gold{background:var(--gold-soft);color:var(--gold-ink);border-color:var(--gold)}
.official{background:var(--gold);color:var(--on-gold)}
.primary{background:var(--primary-soft);color:var(--primary-ink)}
.sakura{background:var(--sakura-soft);color:var(--sakura-ink)}
.success{background:var(--success-soft);color:var(--success-ink)}
</style>
</head>
<body>
<div class="wrap">
<span class="b gold">Niv. 14 · Mage</span>
<span class="b official">Officiel</span>
<span class="b primary">Quiz master</span>
<span class="b sakura">Fin dans 2 j</span>
<span class="b success">En ligne</span>
</div>
</body>
</html>
